<!doctype html>
<html lang="is">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Innskráning í Forritið, velkominn aftur í forritið"
    />
    <meta name="og:title" content="Skráðu þig inn" />
    <meta name="og:description" content="Velkominn aftur í forritið" />

    <title>Skráðu þig inn</title>
    <link rel="stylesheet" href="../main-styles.css" />
  </head>

  <nav>
    <a class="logo" href="../index.html">
      <img src="../img/Logomark.svg" alt="" />
      <span>Forritið</span>
    </a>
    <ul class="left">
      <li><a href="../index.html">Forsíða</a></li>
      <li><a href="teymid.html">Teymið</a></li>
      <li><a href="../index.html">Forritið</a></li>
    </ul>
    <ul class="right">
      <li><a href="skraning.html">Innskráning</a></li>
      <li><a class="takki" href="skraning.html">Skráðu þig</a></li>
    </ul>
  </nav>
  <main>
    <form>
      <div class="innskraning\haus">
        <img src="../img/Logomark.svg" alt="" />
        <h1>Skráðu þig inn</h1>
        <p>Velkominn aftur í forritið</p>
      </div>

      <div>
        <label for="netfang">Netfang</label>
        <input
          type="email"
          id="netfang"
          placeholder="Skráðu netfangið þitt"
          name="netfang"
          required
        />
      </div>

      <div>
        <label for="lykilord">Lykilorð</label>
        <input
          type="password"
          id="lykilord"
          placeholder="********"
          name="lykilord"
          required
        />
      </div>
      <div class="muna">
        <label class="checkbox-plass">
          <input type="checkbox" name="muna" type="checkbox" id="remember-me" />
          Mundu eftir mér í 30 daga
        </label>
        <a href="skraning.html" class="forgot-password">Gleymt lykilorð?</a>
      </div>

      <button class="takki">Innskráning</button>

      <button class="takki takki-icon">Innskráning með Google</button>

      <p class="adgangur">
        Ekki með aðgang?<a href="skraning.html">Skráðu þig</a>
      </p>
    </form>
  </main>
</html>
