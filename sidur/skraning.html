<!doctype html>
<html lang="is">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Innskráning í Forritið, velkominn aftur í forritið"
    />
    <meta name="og:title" content="Skráðu þig inn" />
    <meta name="og:description" content="Velkominn aftur í forritið" />

    <title>Skráðu þig inn</title>
    <link rel="stylesheet" href="css/skraning.css" />
  </head>

  <h1>Skráðu þig inn</h1>
  <p>Velkominn aftur í forritið</p>
  <fieldset>
    <div>
      <label for="netfang">Netfang</label>
      <input
        type="email"
        id="netfang"
        placeholder="abc@netfang.is"
        name="netfang"
        required
      />
    </div>

    <div>
      <label for="lykilord">Lykilorð</label>
      <input
        type="password"
        id="lykilord"
        placeholder="*******"
        name="lykilord"
        required
      />
    </div>
  </fieldset>
  <fieldset>
    <div class="checkbox">
      <input
        name="samþykki"
        type="checkbox"
        id="remember-me"
        class="checkbox"
        required
      />
      <label for="remember-me">Mundu eftir mér í 30 daga</label>
      <a href="skraning.html" class="forgot-password">Gleymt lykilorð?</a>
    </div>
  </fieldset>
  <fieldset>
    <button class="takki">Innskráning</button>
    <button class="takki">Innskráning með Google</button>
  </fieldset>
  <fieldset>
    <label for="new-account">Ekki með aðgang?</label>
    <a href="skraning.html" class="create-account">Skráðu þig</a>
  </fieldset>
</html>
